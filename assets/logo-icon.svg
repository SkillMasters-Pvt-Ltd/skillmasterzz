<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FA65B" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="iconBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3FA65B" />
      <stop offset="100%" stop-color="#52B76E" />
    </linearGradient>
    <linearGradient id="iconBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#5CC87B" />
    </linearGradient>
    <linearGradient id="iconBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#48A14D" />
    </linearGradient>
  </defs>

  <!-- Growth Chart Bars -->
  <!-- Left Bar -->
  <rect x="35" y="90" width="30" height="85" rx="10" fill="url(#iconBar1)" />
  
  <!-- Middle Bar -->
  <rect x="75" y="65" width="30" height="110" rx="10" fill="url(#iconBar2)" />
  
  <!-- Right Bar -->
  <rect x="115" y="35" width="30" height="140" rx="10" fill="url(#iconBar3)" />

  <!-- Upward Trend Line & Arrow -->
  <path d="M 12 95 L 60 48 L 92 78 L 148 18" 
        fill="none" 
        stroke="url(#iconGreenGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Arrow Head -->
  <polygon points="128,10 175,0 162,45 148,22" fill="#4CAF50" />
</svg>
